    <body>
        <header>
          <!-- This site was created for ITFN 1401 by Aesiana- My Booking page  -->
            <nav>
                <ul>
                    <li><a href= "index.html">Home</a></li>
                    <li><a href= "index.html">Services</a></li>
                    <li><a href= "book.html">Book</a></li>
                    
                </ul>
            </nav>
        
        </header>
    
        <main>
            <form>
            <fieldset>
                <!-- Add <span class="number">#</span> in front of the legends to style them differently -->
                <legend>Party Details</legend>
                <label for="FirstName">First Name:</label>
                <input type="text" name="name" id="FirstName">
                <label for="LastName">Last Name:</label>
                <input type="text" name="name" id="LastName"><br>
                <label for="Email">Email Address:</label>
                <input type="email" name="email" id="Email">
                <label for="Phone">Phone Number:</label>
                <input type="tel" name="phone" id="Phone"><br>
                <label for="Details">Party Details:</label>
                <textarea name="details" id="Details" rows="5" cols="50">Please include the number of expected guests
and the location of the party. As well as any details you want me to know about your event!</textarea>
                
            </fieldset>
                
                <fieldset>
                    <legend> Select your Service</legend>
                    <label for="Package">How would you like to be served? Choose your drink package!</label>
                    <select id="Package">
                    <option>You Provide, I pour!</option>
                    <option>You Provide, I provide and I pour!</option>
                    <option>I provide and I pour!</option>  
                    </select><br>
                    <input type="checkbox" id="Special" value="Speciality Drink">
                    <label for="Special"> Would you like to add a Speciality Drink(s)?</label>
                    
                </fieldset>
            <input type="submit" value="Let's make your event pour-fect!!">
            <input type="reset" value="Start Over!">
                
            </form>
        
        
        
        </main>
        
        <footer>
